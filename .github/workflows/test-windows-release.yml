name: Python PyPi Release

on:
  push:
    branches:
        "fix/**"
    

permissions:
  contents: read
jobs:
  windows:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x64
          - os: windows-2022
            target: x86
          - os: windows-11-arm
            target: aarch64
        # This will run every OS/Target combo against these Python versions
        python-version: ["3.12", "3.13", "3.14", "3.14t"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Recommended v4 for local 'act' support

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5 # Recommended v5 for local 'act' support
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          # Maps aarch64 to arm64 for the python installer
          architecture: ${{ matrix.target == 'aarch64' && 'arm64' || matrix.target }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # -i python ensures we build for the specific version set up above
          args: --release --out dist -i python --manifest-path Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          # Unique name per job to prevent overwrite errors
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist