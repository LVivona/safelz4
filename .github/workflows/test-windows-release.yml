name: Python PyPi Release

on:
  push:
    branches:
        "fix/**"
    

permissions:
  contents: read
jobs:
  windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
        python-version: ["3.14", "3.14t", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Download wheels from artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.runner.target }}
          # -i python ensures we build for the specific version set up above
          args: --release --out dist -i python --manifest-path Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          # Unique name per job to prevent overwrite errors
          name: wheels-${{ matrix.runner }}-${{ matrix.runner.target }}-${{ matrix.python-version }}
          path: dist